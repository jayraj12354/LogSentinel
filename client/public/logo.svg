<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="LogSentinel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26373f"/>
      <stop offset="1" stop-color="#16222a"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px body centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- log lines -->
  <g stroke="#3b4f5b" stroke-width="34" stroke-linecap="round">
    <path d="M232 318h140M232 706h208M640 706h152M604 318h188"/>
  </g>
  <!-- the trace: a quiet log stream with one spike -->
  <path d="M212 512h196l70-214 92 412 64-262 40 64h138" fill="none" stroke="#7fa0ff" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- alert at the spike -->
  <circle cx="478" cy="298" r="58" fill="#ff6b57"/>
  <circle cx="478" cy="298" r="58" fill="none" stroke="#16222a" stroke-width="20"/>
</svg>
